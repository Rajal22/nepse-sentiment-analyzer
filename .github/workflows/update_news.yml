name: Update NEPSE News

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pymongo[srv] certifi google-generativeai python-dotenv



      - name: Debug secret length
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "MONGODB_URI length: ${#MONGODB_URI}"
          echo "First 15 chars: ${MONGODB_URI:0:15}"

      - name: Run update script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_news.py
